[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ipasc_iqa"
dynamic = ["version"]
description = "Benchmarking framework for Image Quality Assessment of photoacoustic image reconstructions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "IPASC" }]
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "tifffile<2026.6.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "jsonschema>=4.21",
    "diskcache>=5.6",
    "platformdirs>=4.2",
    "tqdm>=4.66",
    "pillow>=10.0",

    # PyTorch-based IQA measures are part of the default installation.
    # The default installation targets CPU execution. Users who need GPU/CUDA
    # should install the appropriate PyTorch build following the official
    # PyTorch installation selector.
    "torch>=2.2",
    "torchvision>=0.17",
    "lpips>=0.1.4",
    "DISTS-pytorch>=0.1",
    "piq>=0.8.0",
]

[project.optional-dependencies]
gui   = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "bcrypt>=4.1"]
dev   = ["pytest", "pytest-cov", "ruff", "mypy", "hypothesis", "pre-commit", "httpx>=0.27"]
docs  = ["mkdocs-material", "mkdocstrings[python]"]
all   = ["ipasc_iqa[gui]"]

[project.scripts]
ipasc_iqa = "ipasc_iqa.cli.main:app"
ipasc_iqa-gui = "ipasc_iqa.gui.server:main"

[project.entry-points."ipasc_iqa.measures"]
psnr = "ipasc_iqa.measures.classical.psnr:PSNRMeasure"
ssim = "ipasc_iqa.measures.classical.ssim:SSIMMeasure"
cnr  = "ipasc_iqa.measures.classical.cnr:CNRMeasure"
snr  = "ipasc_iqa.measures.classical.snr:SNRMeasure"
mse  = "ipasc_iqa.measures.classical.mse:MSEMeasure"
mae   = "ipasc_iqa.measures.classical.mae:MAEMeasure"
tv      = "ipasc_iqa.measures.classical.tv:TVMeasure"
brisque = "ipasc_iqa.measures.deep.brisque:BRISQUEMeasure"
lpips   = "ipasc_iqa.measures.deep.lpips:LPIPSMeasure"
dists   = "ipasc_iqa.measures.deep.dists:DISTSMeasure"
msssim  = "ipasc_iqa.measures.deep.msssim:MSSSIMMeasure"
iwssim  = "ipasc_iqa.measures.deep.iwssim:IWSSIMMeasure"
vif     = "ipasc_iqa.measures.deep.vif:VIFMeasure"
fsim    = "ipasc_iqa.measures.deep.fsim:FSIMMeasure"
gmsd    = "ipasc_iqa.measures.deep.gmsd:GMSDMeasure"
msgmsd  = "ipasc_iqa.measures.deep.msgmsd:MSGMSDMeasure"
haarpsi = "ipasc_iqa.measures.deep.haarpsi:HaarPSIMeasure"
haarpsimed = "ipasc_iqa.measures.deep.haarpsimed:HaarPSIMedMeasure"
clipiqa = "ipasc_iqa.measures.deep.clipiqa:CLIPIQAMeasure"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/ipasc_iqa/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ipasc_iqa"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI and Typer use function calls (Form/Query/Depends/Option) in argument
# defaults by design.
"src/ipasc_iqa/gui/routes/*" = ["B008"]
"src/ipasc_iqa/cli/*" = ["B008"]

[tool.mypy]
strict = true
files = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
