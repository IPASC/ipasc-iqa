{# Lightweight sign-in: matched by email, no password. #}
<form class="panel annotate-login" hx-post="/contribute/login"
      hx-target="#contribute-root" hx-swap="innerHTML">
  <h2 class="panel__title">Sign in to annotate</h2>
  <p class="panel__hint">
    We match you by email so your annotations are attributed consistently across
    sessions. There's no password — if the email is new we'll start a fresh
    profile, otherwise we'll pick up where you left off.
  </p>

  <label class="field">
    <span class="field__label">Name</span>
    <input class="select" name="name" required autocomplete="name">
  </label>
  <label class="field">
    <span class="field__label">Email</span>
    <input class="select" name="email" type="email" required autocomplete="email">
  </label>

  <div class="actions">
    <button type="submit" class="btn btn--primary">Continue</button>
  </div>
</form>
