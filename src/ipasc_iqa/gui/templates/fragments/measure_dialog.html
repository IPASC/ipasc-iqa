{# Measure-info popup, filled by /static/js/citations.js from the .measure-info
   template next to each clicked info button (delegated, survives HTMX swaps). #}
<dialog id="measure-dialog" class="cite-dialog">
  <div class="cite-dialog__card">
    <div id="measure-dialog-body" class="measure-dialog__body"></div>
    <form method="dialog" class="cite-dialog__foot">
      <button class="btn">Close</button>
    </form>
  </div>
</dialog>
