{% extends "base.html" %}
{% block title %}IPASC IQA — Sign in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="panel auth-form" method="post" action="/login">
    <h2 class="panel__title">Sign in</h2>
    {% if message %}<p class="notice notice--ok">{{ message }}</p>{% endif %}
    {% if error %}<p class="notice notice--warn">{{ error }}</p>{% endif %}

    <label class="field">
      <span class="field__label">Email</span>
      <input class="select" name="email" type="email" required autocomplete="email"
             value="{{ email or '' }}">
    </label>
    <label class="field">
      <span class="field__label">Password</span>
      <input class="select" name="password" type="password" required autocomplete="current-password">
    </label>

    <div class="actions">
      <button type="submit" class="btn btn--primary">Sign in</button>
    </div>
    <p class="panel__hint">
      <a href="/register">Create an account</a> · <a href="/forgot">Forgot your password?</a>
    </p>
  </form>
</div>
{% endblock %}
